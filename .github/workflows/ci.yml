name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: fair, POSTGRES_PASSWORD: fair, POSTGRES_DB: fair }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fair" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgres://fair:fair@localhost:5432/fair
      REDIS_URL: redis://localhost:6379
      REDIS_TEST_URL: redis://localhost:6379/15
      POSTGRES_TEST_URL: postgres://fair:fair@localhost:5432/fair
    steps:
      - uses: actions/checkout@v4
      # No version here: pnpm/action-setup reads packageManager from the root package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @galabet/fair build
      - run: pnpm --filter @galabet/fair test
      - run: pnpm vectors:check
      - run: node --import tsx spec/check-spec.ts
      - run: pnpm --filter api typecheck
      - run: pnpm --filter api test
      - run: pnpm --filter api build
